[package]
name = "chronosagent-safestate"
version = "0.1.0"
description = "ChronosAgent SafeState - Autonomous AI Runtime Guardrail & Time-Travel Debugging"
authors = ["doumoments <elpepinillojoseuwu@gmail.com>"]
edition = "2021"

[lib]
name = "chronosagent_safestate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.2.0", features = [] }
tauri-plugin-shell = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
sysinfo = "0.33"
rusqlite = { version = "0.33", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.43", features = ["full"] }
tiny_http = "0.12"
regex = "1.11"
uuid = { version = "1.13", features = ["v4", "serde"] }
